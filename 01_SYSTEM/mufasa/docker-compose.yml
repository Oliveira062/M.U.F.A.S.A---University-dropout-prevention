x-app: &app
  build: .
  image: mufasa:1.1.0
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./logs:/app/logs
  depends_on:
    build_database:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python -m scripts.configure --docker}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  build_database:
    build: .
    image: mufasa:1.1.0
    env_file: .env
    command: ["python", "-m", "scripts.build_database", "--yes", "--if-not-exist"]
    user: root
    environment:
      MUFASA_CREDENTIALS: /app/credentials/credentials.csv
    volumes:
      - ./credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      retries: 3

  chat:
    <<: *app
    command: ["uvicorn", "app.main_chat:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      retries: 3

  calculation:
    <<: *app
    command: ["python", "-m", "app.calculation_service"]

  dashboard:
    <<: *app
    working_dir: /app/dashboard
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0"]
    ports: ["127.0.0.1:8501:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      retries: 3

volumes:
  data:
